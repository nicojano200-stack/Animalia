name: Restore original Animalia source files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-animalia.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore missing files from original archive in repository history
        run: |
          git show 993f6c35811a0f566168b3934f4541d5661fe3ea:Animalia_Guided_Tutorial_Source.zip > "$RUNNER_TEMP/animalia-source.zip"
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, zipfile
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"]) / "animalia-source.zip") as archive:
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  if entry.is_dir() or path.parts[0] not in ("assets", "src", "levels"):
                      continue
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError("Unsafe archive path")
                  target = Path(path)
                  if not target.exists():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
                      print("Restored", target)
          PY
          npm test
          git add -- assets src levels
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Restore missing Animalia game source and assets"
            git push origin HEAD:main
          fi
